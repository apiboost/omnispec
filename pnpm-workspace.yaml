# Single-package repo. This file carries pnpm settings that pnpm 11 reads
# from here (build-script allowlist and security overrides).

# Allow these dependencies to run install/build scripts (native binaries).
allowBuilds:
  esbuild: true
  protobufjs: true

# Security pins for transitive dependencies.
overrides:
  brace-expansion@<=5.0.7: ^5.0.8
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
