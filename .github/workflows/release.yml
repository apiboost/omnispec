name: Release

# Stable release. The version comes from the committed package.json (bump it in a
# PR to main first), so git and npm stay in lockstep. Run this from main after the
# version-bump PR merges.
on:
  workflow_dispatch:

permissions:
  contents: write # push the git tag
  id-token: write # npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile

      - name: Read version from package.json
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Guard — reject prereleases and duplicates
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            echo "::error::$VERSION is a prerelease. Use the 'Release (dev prerelease)' workflow for -dev builds."
            exit 1
          fi
          if npm view "@apiboost/omnispec@$VERSION" version >/dev/null 2>&1; then
            echo "::error::@apiboost/omnispec@$VERSION is already published. Bump the version in a PR to main first."
            exit 1
          fi

      # build + check:licenses + verify:pack run automatically via the
      # prepublishOnly lifecycle script, so any publish path is guarded.
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the release
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
