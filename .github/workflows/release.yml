name: Release

# Automated release via semantic-release. On a push to main it analyzes the
# conventional commits since the last release tag, computes the next version,
# publishes to npm with provenance, tags the commit, and creates a GitHub
# Release with generated notes. Pushing to the `dev` branch publishes a
# prerelease under the `dev` dist-tag (install with `@apiboost/omnispec@dev`).
on:
  push:
    branches: [main, dev]

permissions:
  contents: write # create tags + GitHub Releases
  issues: write # semantic-release success comments
  pull-requests: write # semantic-release success comments
  id-token: write # npm provenance (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      # build + check:licenses + verify:pack run automatically via the
      # prepublishOnly lifecycle script when semantic-release runs `npm publish`.
      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
