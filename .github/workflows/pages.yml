name: Deploy Docs to GitHub Pages

# DORMANT until launch: manual trigger only. At go-live, add the push trigger:
#   push:
#     branches: [main]
#     paths: ['docs/**', 'website/**', '.github/workflows/pages.yml']
# and enable Pages in repo settings with "GitHub Actions" as the source.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      # The Live Demo page imports the library via a `file:..` dependency, so the
      # package's dist must exist before the site builds. Build the library first
      # (from the repo root), then install + build the site.
      - name: Build the library (for the demo's file:.. dependency)
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
