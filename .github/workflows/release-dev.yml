name: Release (dev prerelease)

# Publishes a throwaway prerelease of a dev branch under the `dev` dist-tag, so it
# can be installed and tested without touching `latest`. Version is
# `<package.json version>-dev.<short-sha>`. No git tag is created.
#   Install:  npm i @apiboost/omnispec@dev        (latest dev build)
#             npm i @apiboost/omnispec@<version>   (a specific one)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or ref to publish a -dev build from"
        required: true
        default: "main"

permissions:
  contents: read
  id-token: write # npm provenance (OIDC)

jobs:
  publish-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile

      - name: Compute dev version
        id: v
        run: |
          BASE=$(node -p "require('./package.json').version")
          BASE=${BASE%%-*} # strip any existing prerelease suffix
          echo "version=${BASE}-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - run: npm version "${{ steps.v.outputs.version }}" --no-git-tag-version

      # build + guards run via the prepublishOnly lifecycle script.
      - name: Publish dev prerelease
        run: npm publish --access public --provenance --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          V="${{ steps.v.outputs.version }}"
          {
            echo "Published \`@apiboost/omnispec@$V\` under dist-tag \`dev\`."
            echo ""
            echo '```bash'
            echo "npm i @apiboost/omnispec@$V   # this exact build"
            echo "npm i @apiboost/omnispec@dev  # latest dev build"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
